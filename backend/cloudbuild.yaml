substitutions:
  _PROJECT_ID: "your-project-id"

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$_PROJECT_ID/rails-backend', './backend']
  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$_PROJECT_ID/rails-backend']
  
  - name: 'gcr.io/cloud-builders/gcloud'
    args: ['run', 'deploy', 'rails-backend', '--image', 'gcr.io/$_PROJECT_ID/rails-backend', '--platform', 'managed', '--region', 'us-east1', '--allow-unauthenticated', '--set-env-vars', 'PORT=8080']
